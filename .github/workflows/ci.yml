name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest

    # The integration tests hit a real Postgres rather than a mock, so CI
    # needs one. The name carries "test" because tests/setup/globalSetup.ts
    # refuses to run against a database whose name does not.
    # Postgres and Mailpit both run as GitHub-hosted-runner Docker
    # containers — the runner has Docker even though the dev machine this
    # workflow was last edited on does not (see docs/engineering/
    # VERIFICATION.md's Phase 4 notes on the Testcontainers plan).
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: medguard
          POSTGRES_PASSWORD: medguard
          POSTGRES_DB: medguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # No health-cmd here: unlike postgres:14, mailpit's own image doesn't
      # reliably ship a tool to probe its own HTTP API with, and it starts
      # in well under a second anyway — globalSetup.ts's own
      # ensureMailpitRunning() polls it before any test runs regardless.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_test?schema=public
      TEST_DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_test?schema=public
      # demo-reset.test.ts and meridian-seed.test.ts each need their own
      # database (see vitest.demo-reset.config.ts / vitest.meridian-seed.config.ts) —
      # `npm test` chains all three configs, and globalSetup.ts now creates
      # each one itself if it doesn't exist (see that file), so CI doesn't
      # need a separate "create the database" step any more either.
      DEMO_TEST_DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_demo_test?schema=public
      MERIDIAN_TEST_DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_meridian_test?schema=public
      MAILPIT_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm 11 blocks package install scripts by default. Without this the
      # install "succeeds" but never fetches the Prisma engine or the esbuild
      # binary, and every later step fails for reasons that point nowhere
      # near the cause.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild prisma @prisma/engines esbuild

      # The client is generated output and gitignored, so it must be built
      # before anything imports it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Separate from `npm test`: coverage instrumentation changes stack
      # traces/timing enough that it's worth keeping the main suite run
      # clean, and this only needs to run against the primary database.
      - name: Coverage (risk-engine gate)
        run: npm run test:coverage

      # openapi.json is committed, hand-curated-feeling output that's
      # actually generated — nothing stops someone from editing a route's
      # Zod schema and forgetting to regenerate it. tests/openapi-contract.test.ts
      # already catches this inside `npm test` above; this step exists so
      # the specific failure mode has its own clearly-named CI step rather
      # than being buried in a 1000+-test run's output.
      - name: OpenAPI freshness
        run: |
          npm run openapi:generate
          git diff --exit-code openapi.json || \
            (echo "::error::openapi.json is stale — run 'npm run openapi:generate' and commit the result" && exit 1)

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    # Item C's own instruction: this is the one piece of "Docker" that has
    # to run somewhere, since the dev machine this was built on has no
    # working Docker daemon (see docs/engineering/VERIFICATION.md) — the
    # GitHub-hosted runner does.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: medguard
          POSTGRES_PASSWORD: medguard
          POSTGRES_DB: medguard_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_docker?schema=public
      JWT_SECRET: a-sufficiently-long-ci-only-signing-key-not-used-anywhere-real
      DEMO_USER_PASSWORD: a-ci-only-demo-password-1234
      FRONTEND_ORIGIN: http://localhost:8080

    steps:
      - uses: actions/checkout@v5

      - name: Build the runtime image
        run: docker build --target runner -t drishti-api:ci .

      # Migrations are deliberately NOT run by the image's own CMD (see the
      # Dockerfile's comment) — they're a release step, run here the same
      # way DEPLOYMENT.md and docker-compose.yml's `migrate` service do: the
      # `build` stage still has the Prisma CLI, the `runner` stage doesn't.
      - name: Migrate and seed, via the build stage
        run: |
          docker build --target build -t drishti-api:build .
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            drishti-api:build npx prisma migrate deploy
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" -e DEMO_USER_PASSWORD="$DEMO_USER_PASSWORD" \
            drishti-api:build npm run db:seed

      - name: Run the runtime image
        run: |
          docker run -d --network host --name drishti-api-ci \
            -e DATABASE_URL="$DATABASE_URL" -e JWT_SECRET="$JWT_SECRET" \
            -e FRONTEND_ORIGIN="$FRONTEND_ORIGIN" -e DEMO_USER_PASSWORD="$DEMO_USER_PASSWORD" \
            -e PORT=4000 \
            drishti-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/healthz && exit 0
            sleep 1
          done
          docker logs drishti-api-ci
          echo "container never became healthy" && exit 1

      - name: Smoke test
        run: |
          curl -sf http://localhost:4000/healthz
          curl -sf http://localhost:4000/readyz
          TOKEN=$(curl -s http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@wayam.ai","password":"'"$DEMO_USER_PASSWORD"'"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).data.token')
          test -n "$TOKEN"
          curl -sf http://localhost:4000/api/auth/me -H "Authorization: Bearer $TOKEN" | grep -q admin@wayam.ai

      - name: Container logs
        if: always()
        run: docker logs drishti-api-ci || true

  zap:
    name: ZAP baseline/active scan
    runs-on: ubuntu-latest
    # Item 6's own instruction: keep this job even where the native scan
    # can't run (ZAP's brew cask is Gatekeeper-disabled on at least one dev
    # machine this was built on — see docs/engineering/VERIFICATION.md).
    # The GitHub-hosted runner has Docker regardless of any dev machine.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: medguard
          POSTGRES_PASSWORD: medguard
          POSTGRES_DB: medguard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medguard:medguard@localhost:5432/medguard_dev?schema=public
      JWT_SECRET: a-sufficiently-long-ci-only-signing-key-not-used-anywhere-real
      DEMO_USER_PASSWORD: a-ci-only-demo-password-1234
      FRONTEND_ORIGIN: http://localhost:8080
      PORT: "4000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild prisma @prisma/engines esbuild

      - name: Generate Prisma client, migrate, seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Start the API in the background
        run: |
          npm run build
          node dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "API never became healthy" && exit 1

      - name: Log in, fetch real resource ids, bake both into the plan
        run: |
          TOKEN=$(curl -s http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@wayam.ai","password":"'"$DEMO_USER_PASSWORD"'"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).data.token')

          # Real ids from the seeded Meridian data, not ZAP's own placeholder
          # path-param defaults — without this, ID-scoped routes 404 on
          # whatever ZAP guesses and the active scan never reaches their
          # real logic (see docs/engineering/SECURITY_REVIEW.md's ZAP
          # section for the scan-coverage gap this closes).
          id_of() {
            curl -s "http://localhost:4000/api/$1" -H "Authorization: Bearer $TOKEN" \
              | node -pe "JSON.parse(require('fs').readFileSync(0)).data[0].id"
          }
          export DRISHTI_ZAP_TOKEN="$TOKEN"
          export DRISHTI_ASSET_ID=$(id_of assets)
          export DRISHTI_VENDOR_ID=$(id_of vendors)
          export DRISHTI_IDENTITY_ID=$(id_of identities)
          export DRISHTI_THREAT_ID=$(id_of threats)
          export DRISHTI_CONTROL_ID=$(id_of controls)
          export DRISHTI_POLICY_ID=$(id_of policies)
          export DRISHTI_REMEDIATION_ID=$(id_of remediations)
          export DRISHTI_ACCESS_ID=$(id_of access)
          export DRISHTI_PHITYPE_ID=$(id_of phi-types)

          envsubst '${DRISHTI_ZAP_TOKEN} ${DRISHTI_ASSET_ID} ${DRISHTI_VENDOR_ID} ${DRISHTI_IDENTITY_ID} ${DRISHTI_THREAT_ID} ${DRISHTI_CONTROL_ID} ${DRISHTI_POLICY_ID} ${DRISHTI_REMEDIATION_ID} ${DRISHTI_ACCESS_ID} ${DRISHTI_PHITYPE_ID}' \
            < security/zap/automation-plan.yaml > /tmp/zap-plan.yaml

      - name: Run ZAP
        run: |
          docker run --rm --network host \
            -v /tmp:/zap/wrk/:rw \
            -v "$GITHUB_WORKSPACE/openapi.json:/zap/wrk/openapi.json:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-plan.yaml

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: /tmp/zap-report.json
          if-no-files-found: warn
