# Local development stack: Postgres plus the API.
#
# Secrets come from the environment, never from this file. Copy .env.example
# to .env and fill it in; compose reads .env automatically.
#
# This file is for development. It is not a production topology: there is no
# TLS termination, no replica count and no managed backup.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-drishti_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - drishti-db:/var/lib/postgresql/data
    healthcheck:
      # Named database and user, not the defaults -- pg_isready with no
      # arguments reports the server is up before this database exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drishti} -d ${POSTGRES_DB:-drishti_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        # Waits for the healthcheck above, not merely for the container to
        # exist, so the API does not start against a database still booting.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drishti_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random chars)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Applies pending migrations, then exits. Run it explicitly:
  #
  #   docker compose run --rm migrate
  #
  # Deliberately not part of `up`: a service that migrates on every start
  # races the other replicas during a rolling deploy.
  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drishti_dev}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  drishti-db:
